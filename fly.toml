# Nome dell'app su Fly: il sito è https://people-pulse.fly.dev (creata con tools/pubblica_fly.py).
app = "people-pulse"
primary_region = "cdg" # Parigi: vicino all'Italia. Scegli per Neon una regione EU (es. Francoforte).

[build]

[env]
  PULSE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # le macchine in più si spengono senza traffico…
  auto_start_machines = true
  min_machines_running = 1   # …ma una resta sempre accesa: l'app si apre subito e le anteprime dei link funzionano

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB: margine per l'elaborazione delle foto (circa 3,69 $/mese se sempre accesa, meno con lo spegnimento
  # automatico). Con 256 MB (circa 2,19 $/mese) l'app funziona, ma una foto molto grande può esaurire la memoria.
  memory = "512mb"
